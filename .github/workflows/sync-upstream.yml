name: Sync with Upstream

on:
  schedule:
    # 每天执行一次，可以根据需要调整
    - cron: "0 0 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          # 使用 Personal Access Token (PAT) 以便可以推送到仓库
          # 前往 https://github.com/settings/tokens/new 创建一个具有 repo 权限的 PAT
          # 然后在你的 fork 仓库的 Settings > Secrets and variables > Actions 中添加一个名为 PAT 的 secret
          token: ${{ secrets.PAT }}
          # 确保 fetch-depth: 0 以获取完整的 git 历史
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Sync with upstream repository
        run: |
          # 添加上游仓库的 remote
          git remote add upstream https://github.com/wyx2685/V2bX.git

          # 从上游仓库 fetch 最新的 dev_new 分支
          git fetch upstream dev_new

          # 硬重置本地 dev_new 分支到上游的状态，这会丢弃你的 commit，但没关系，我们马上加回来
          git checkout dev_new
          git reset --hard upstream/dev_new

          # 核心步骤：使用 sed 命令重新将 'with_tailscale' 添加到 workflow 文件中
          # 这个命令会查找包含特定 tags 的行，并在 gvisor 后面安全地插入 with_tailscale
          sed -i 's/\(with_gvisor"\)/\1 with_tailscale"/' .github/workflows/release.yml

          # 检查修改是否成功
          echo "--- Modified release.yml content ---"
          cat .github/workflows/release.yml
          echo "------------------------------------"

          # 添加修改并创建一个新的 commit
          git add .github/workflows/release.yml
          # 判断是否真的有文件变动，防止在没有新 commit 时也强制推送
          if ! git diff --staged --quiet; then
            git commit -m "chore: Apply custom build tag 'with_tailscale' after upstream sync"
            # 强制推送到你的 fork，因为我们用了 git reset --hard，历史记录已经改变
            git push origin dev_new --force
          else
            echo "No changes to apply. Branch is up to date."
          fi
